<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive · app personale</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --accent: #0071e3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6; --accent: #2997ff; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 20px; }
  .card { background: var(--card); border-radius: 18px; padding: 32px 28px; }
  h1 { font-size: 32px; letter-spacing: -0.02em; margin: 0 0 12px; }
  p { margin: 0 0 14px; color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Drive</h1>
    <p>Applicazione personale e privata per caricare file e cartelle dal proprio PC su Google Drive.</p>
    <p>Funziona solo sul computer del proprietario: non è un servizio pubblico, non ha utenti esterni e non raccoglie dati di nessuno.</p>
    <p><a href="privacy.html">Informativa sulla privacy</a></p>
  </div>
</main>
</body>
</html>
